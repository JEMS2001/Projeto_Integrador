# Laravel Sail + Frontend Configuration
services:
  # Laravel Application (using Sail)
  laravel.test:
    build:
      context: './backend/vendor/laravel/sail/runtimes/8.4'
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: 'sail-8.4/app'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-8000}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}/backend'
    volumes:
      - './backend:/var/www/html'
    networks:
      - sail
    depends_on:
      - mysql

  # MySQL Database (using Sail configuration)
  mysql:
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-projeto_integrador_dev}'
      MYSQL_USER: '${DB_USERNAME:-app_user}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - './backend/vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD:-password}'
      retries: 3
      timeout: 5s  # Frontend (Next.js with Bun)
  frontend:
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.dev}
    container_name: projeto_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-http://localhost:8000}'
      NEXT_PUBLIC_APP_NAME: '${NEXT_PUBLIC_APP_NAME:-Projeto Integrador}'
    ports:
      - "3000:3000"
    volumes:
      - './frontend:/app'
      - '/app/node_modules'
      - '/app/.next'
    networks:
      - sail
    depends_on:
      - laravel.test

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local