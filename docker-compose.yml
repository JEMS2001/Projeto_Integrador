version: '3.8'

services:
  apache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apache
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - webnet
    volumes:
      - ./Projeto-Integrador:/var/www/html  
    depends_on:
      - mysql
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: projeto_integrador_dev
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - webnet
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    networks:
      - webnet
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: python
    restart: unless-stopped
    networks:
      - webnet

  # Redis Service (for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - webnet
  # Backend Service (Laravel with PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        user: sail
        uid: 1000
    image: sail-8.2/app
    container_name: backend_app
    restart: unless-stopped
    ports:
      - "8000:9000"
    volumes:
      - ./backend:/var/www/html
    environment:
      # Laravel Environment Variables
      APP_NAME: "Projeto Integrador"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      
      # Database Configuration
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: projeto_integrador_dev
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
      
      # Mail Configuration
      MAIL_MAILER: log
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
        # Session and Cache
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    networks:
      - webnet
    depends_on:
      - mysql
      - redis
  # Nginx Service (to serve Laravel backend)
  nginx:
    image: nginx:alpine
    container_name: backend_nginx
    restart: unless-stopped
    ports:
      - "8081:80" # Nginx listening on port 8081 to avoid conflict
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf # Nginx configuration
    networks:
      - webnet
    depends_on:
      - backend
  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Next.js Environment Variables
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8081/api
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
      NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: "Projeto Integrador"
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_APP_DEBUG: "true"
      
      # API Endpoints
      NEXT_PUBLIC_USERS_API_ENDPOINT: /users
      NEXT_PUBLIC_PROJECTS_API_ENDPOINT: /projects
      NEXT_PUBLIC_TASKS_API_ENDPOINT: /tasks
      NEXT_PUBLIC_REPORTS_API_ENDPOINT: /reports
      
      # Authentication Endpoints
      NEXT_PUBLIC_AUTH_ENDPOINT: /auth
      NEXT_PUBLIC_LOGIN_ENDPOINT: /auth/login
      NEXT_PUBLIC_LOGOUT_ENDPOINT: /auth/logout
      NEXT_PUBLIC_REGISTER_ENDPOINT: /auth/register
      
      # File Upload
      NEXT_PUBLIC_UPLOAD_ENDPOINT: /upload
      NEXT_PUBLIC_MAX_FILE_SIZE: 10485760
    networks:
      - webnet
    depends_on:
      - backend

networks:
  webnet:

volumes:
  mysql_data:
  redis_data:
